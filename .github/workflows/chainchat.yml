name: Resolve OpenClaw 2026.11.4 lock (isolated CI)
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Fixed isolated dependency metadata resolution
        type: string
        default: full
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15.2'
      - name: Prepare repository-verified secured npm before dependency resolution
        shell: bash
        run: |
          set -euo pipefail
          python -I -B installer/bootstrap_npm.py prepare-npm --application . --cache "$RUNNER_TEMP/security-cache" --destination "$RUNNER_TEMP/secured-npm" > "$RUNNER_TEMP/secured-npm.json"
          python -c 'import json,os; from pathlib import Path; data=json.loads((Path(os.environ["RUNNER_TEMP"])/"secured-npm.json").read_text()); stream=open(os.environ["GITHUB_ENV"],"a",encoding="utf-8"); stream.write("CT_BOOTSTRAP_NPM_CLI="+data["npmCli"]+"\n"); stream.close()'
      - name: Resolve fixed official runtime lock without installing or executing SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/openclaw-114-output"
          python -B - <<'PY'
          import json
          from pathlib import Path
          path=Path("openclaw/runtime/package.json")
          data=json.loads(path.read_text())
          assert data["dependencies"]=={"openclaw":"2026.11.3"}
          assert data["overrides"]=={"undici":"8.12.4","zod":"4.6.7","npm":"12.2.2","minimatch":"11.0.8"}
          data["dependencies"]["openclaw"]="2026.11.4"
          path.write_text(json.dumps(data,indent=2)+"\n",encoding="utf-8")
          PY
          : > "$RUNNER_TEMP/empty-user-npmrc"
          : > "$RUNNER_TEMP/empty-global-npmrc"
          npm_args=(install --package-lock-only --ignore-scripts --prefix openclaw/runtime --no-audit --no-fund --cache "$RUNNER_TEMP/lock-cache" --userconfig "$RUNNER_TEMP/empty-user-npmrc" --globalconfig "$RUNNER_TEMP/empty-global-npmrc" --registry https://registry.npmjs.org/)
          retry=0
          if node "$CT_BOOTSTRAP_NPM_CLI" "${npm_args[@]}" > "$RUNNER_TEMP/openclaw-114-output/resolve-initial.log" 2>&1; then
            cat "$RUNNER_TEMP/openclaw-114-output/resolve-initial.log"
          elif grep -q 'EALLOWREMOTE' "$RUNNER_TEMP/openclaw-114-output/resolve-initial.log"; then
            retry=1
            node "$CT_BOOTSTRAP_NPM_CLI" "${npm_args[@]}" --allow-remote=all > "$RUNNER_TEMP/openclaw-114-output/resolve-retry.log" 2>&1
            cat "$RUNNER_TEMP/openclaw-114-output/resolve-retry.log"
          else
            cat "$RUNNER_TEMP/openclaw-114-output/resolve-initial.log"
            exit 1
          fi
          printf '%s\n' "$retry" > "$RUNNER_TEMP/allow-remote-metadata-retry.txt"
          git ls-remote https://github.com/openclaw/openclaw.git 'refs/tags/v2026.11.4' 'refs/tags/v2026.11.4^{}' > "$RUNNER_TEMP/release-tag.txt"
          set +e
          node "$CT_BOOTSTRAP_NPM_CLI" audit --package-lock-only --json --prefix openclaw/runtime --ignore-scripts --cache "$RUNNER_TEMP/lock-cache" --userconfig "$RUNNER_TEMP/empty-user-npmrc" --globalconfig "$RUNNER_TEMP/empty-global-npmrc" --registry https://registry.npmjs.org/ > "$RUNNER_TEMP/openclaw-114-output/audit.json"
          audit_status=$?
          set -e
          printf '%s\n' "$audit_status" > "$RUNNER_TEMP/audit-status.txt"
          python -B - <<'PY'
          import hashlib,json,os,shutil,subprocess,urllib.parse,urllib.request
          from pathlib import Path
          temp=Path(os.environ["RUNNER_TEMP"]); output=temp/"openclaw-114-output"
          package=Path("openclaw/runtime/package.json"); lockfile=Path("openclaw/runtime/package-lock.json")
          manifest=json.loads(package.read_text()); lock=json.loads(lockfile.read_text())
          expected_sri="sha512-kSMzBc0fIWrW4DqneFEXL9FRboCZCQV22Edm6iFPqRaBexUeZp9huWNPVWLXmuSAQRezorPfrABkODqq65NOmw=="
          expected_commit="d843d6af39a42cd3c30084edbeabeece732fd93a"
          assert lock["lockfileVersion"]==3
          assert manifest["dependencies"]=={"openclaw":"2026.11.4"}==lock["packages"][""]["dependencies"]
          node=lock["packages"]["node_modules/openclaw"]
          assert node["version"]=="2026.11.4" and node["integrity"]==expected_sri
          assert node["resolved"]=="https://registry.npmjs.org/openclaw/-/openclaw-2026.11.4.tgz"
          registry=json.load(urllib.request.urlopen("https://registry.npmjs.org/openclaw/2026.11.4",timeout=60))
          assert registry["name"]=="openclaw" and registry["version"]=="2026.11.4"
          assert registry["dist"]["integrity"]==expected_sri and registry["dist"]["tarball"]==node["resolved"]
          tags=dict(line.split()[::-1] for line in (temp/"release-tag.txt").read_text().splitlines())
          assert tags["refs/tags/v2026.11.4^{}"]==expected_commit
          hosts=set()
          for path,row in lock["packages"].items():
              resolved=row.get("resolved")
              if resolved:
                  url=urllib.parse.urlsplit(resolved)
                  assert url.scheme=="https" and url.hostname=="registry.npmjs.org" and url.port in (None,443) and not url.username and not url.password,(path,resolved)
                  hosts.add(url.hostname)
          assert manifest["overrides"]=={"undici":"8.12.4","zod":"4.6.7","npm":"12.2.2","minimatch":"11.0.8"}
          assert not Path("openclaw/runtime/node_modules").exists()
          audit=json.loads((output/"audit.json").read_text())
          assert isinstance(audit.get("vulnerabilities"),dict) and isinstance(audit.get("metadata",{}).get("vulnerabilities"),dict),audit.get("error")
          report={"version":1,"sourceCommit":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
                  "targetOpenClaw":"2026.11.4","officialIntegrity":expected_sri,"officialReleaseCommit":expected_commit,
                  "registryHosts":sorted(hosts),"lockPackageEntries":len(lock["packages"]),"lockSha256":hashlib.sha256(lockfile.read_bytes()).hexdigest(),
                  "packageSha256":hashlib.sha256(package.read_bytes()).hexdigest(),"dependencyOverrides":manifest["overrides"],
                  "allowRemoteMetadataRetry":(temp/"allow-remote-metadata-retry.txt").read_text().strip()=="1",
                  "auditExit":int((temp/"audit-status.txt").read_text()),"auditCounts":audit["metadata"]["vulnerabilities"],
                  "lifecycleScriptsEnabled":False,"sdkInstalled":False,"sdkExecuted":False,"gatewayStarted":False,"actualProviderCalls":0}
          shutil.copyfile(package,output/"package.json"); shutil.copyfile(lockfile,output/"package-lock.json")
          (output/"attestation.json").write_text(json.dumps(report,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(report))
          PY
      - name: Retain lock, audit and source attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-2026.11.4-runtime-lock
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/openclaw-114-output/
